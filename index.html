<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektro editor · Rekonstrukce Vrána</title>
<link rel="stylesheet" href="app.css?v=1">
<style>
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:16px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(420px,96vw)}
.gate h1{font-size:16px;margin:0 0 2px}
.gate p.sub{margin:0 0 16px;color:var(--ink2);font-size:12px}
.gate label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
.gate input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink)}
.gate button.primary{width:100%;margin-top:16px;padding:9px}
.gate .err{margin-top:12px;color:#fff;background:var(--acc);border-radius:6px;padding:8px 10px;font-size:12px}
.gate .foot{margin-top:14px;font-size:11px;color:var(--ink3);line-height:1.5}
.modes{display:flex;gap:6px;margin-bottom:12px}
.modes button{flex:1;padding:7px}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lidi{display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto;margin-top:6px}
.lidi button{text-align:left;padding:8px 10px}
.lidi .unit{padding:6px 2px}
.vybrany{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lnk{background:none;border:none;padding:0;color:var(--sel);cursor:pointer;font-size:12px;text-decoration:underline}
.gate .ok{margin-top:12px;color:#fff;background:var(--ok);border-radius:6px;padding:8px 10px;font-size:12px}
.jobs{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:50vh;overflow:auto}
.jobs button{display:block;width:100%;text-align:left;padding:10px 12px}
.jobs button b{display:block;font-size:13px}
.jobs button span{color:var(--ink2);font-size:11px}
</style>
</head>
<body>

<div class="gate" id="gateLogin" hidden><div class="box">
  <h1>Elektro editor</h1>
  <p class="sub">Rekonstrukce Vrána — zákres koncových prvků</p>
  <div class="modes"><button type="button" id="modeTeren" class="on">👷 Pracovníci</button><button type="button" id="modeKanc">🗂 Vedení / kancelář</button></div>

  <div id="loginTeren">
    <div id="terenVyber">
      <label for="hledat">Kdo jsi?</label>
      <input id="hledat" type="search" placeholder="začni psát jméno…" autocomplete="off">
      <div class="lidi" id="lidi"></div>
    </div>
    <form id="pinForm" hidden>
      <div class="vybrany"><b id="vybranyJmeno"></b><button type="button" id="zmenit" class="lnk">změnit</button></div>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6 číslic" required>
      <button type="submit" class="primary" id="pinBtn">Přihlásit</button>
    </form>
  </div>

  <form id="loginForm" hidden>
    <label for="mail">E-mail</label>
    <input id="mail" type="email" autocomplete="username" required>
    <label for="pass">Heslo</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary" id="loginBtn">Přihlásit</button>
    <div class="foot"><button type="button" id="zapomenute" class="lnk">Zapomenuté heslo</button></div>
  </form>

  <div class="err" id="loginErr" hidden></div>
  <div class="ok" id="loginOk" hidden></div>
  <div class="foot">Stejné přihlášení jako do Deníku staveb. Nemáš přístup? Napiš na info@rekovrana.cz.</div>
</div></div>

<div class="gate" id="gateJobs" hidden><div class="box">
  <h1>Zakázky</h1>
  <p class="sub" id="jobsWho"></p>
  <div class="jobs" id="jobsList"></div>
  <div class="err" id="jobsErr" hidden></div>
  <div class="foot"><button id="logoutBtn">Odhlásit</button></div>
</div></div>

<div id="appRoot" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js?v=1"></script>
<script src="boot.js?v=1"></script>
</body>
</html>
